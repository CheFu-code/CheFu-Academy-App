name: Android Build

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "Android ABIs to build"
        required: false
        default: "x86_64"
      gradle_task:
        description: "Gradle task"
        required: false
        default: "app:assembleDebug"
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_ENV: development
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew "${GRADLE_TASK}" \
            -x lint \
            -x test \
            --stacktrace \
            --console=plain \
            -PreactNativeDevServerPort=8081 \
            -PreactNativeArchitectures="${ARCHITECTURES}"
        env:
          GRADLE_TASK: ${{ github.event.inputs.gradle_task || 'app:assembleDebug' }}
          ARCHITECTURES: ${{ github.event.inputs.architectures || 'x86_64' }}

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chefu-academy-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
