name: Android Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            SENTRY_UPLOAD: false
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Check Android NDK version
              run: |
                  $ANDROID_SDK_ROOT/ndk-bundle/ndk-build --version || echo "NDK bundle not found"
                  ls $ANDROID_SDK_ROOT/ndk/*/source.properties

            - name: Setup Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup Java 17 (Temurin)
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Install npm dependencies (legacy peer deps)
              run: npm install --legacy-peer-deps

            - name: Install Expo CLI globally
              run: npm install -g expo-cli

            - name: Clear Metro cache
              run: rm -rf node_modules/.cache/metro

            - name: Make gradlew executable
              run: chmod +x android/gradlew

            - name: Build Android release APK
              run: cd android && ./gradlew assembleRelease

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: chefuacademy-release-apk
                  path: android/app/build/outputs/apk/release/app-release.apk

            - name: Build Android release AAB
              run: cd android && ./gradlew bundleRelease

            - name: Upload AAB artifact
              uses: actions/upload-artifact@v4
              with:
                  name: chefuacademy-release-aab
                  path: android/app/build/outputs/bundle/release/app-release.aab

            - name: Sentry Info
              run: npx sentry-cli info
