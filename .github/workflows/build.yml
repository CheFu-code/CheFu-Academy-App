name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Set up rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - name: Upload APK to Google Drive
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          rclone copyto android/app/build/outputs/apk/debug/app-debug.apk remote:chefu-academy-artifacts/chefuacademy-debug-${TIMESTAMP}.apk

      - name: List files in remote folder
        run: rclone ls remote:chefu-academy-artifacts

      - name: Sentry Info
        run: npx sentry-cli info
