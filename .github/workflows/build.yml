name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env: # ✅ Sentry auth info from GitHub secrets
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # - name: Expo prebuild (sync native config)
      #   run: npx expo prebuild --no-install

      # - name: Clean Android build
      #   run: cd android && ./gradlew clean

      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chefuacademy-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # - name: Build Android release AAB
      #   run: cd android && ./gradlew bundleRelease

      # - name: Upload AAB artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: chefuacademy-release.aab
      #     path: android/app/build/outputs/bundle/release/app-release.aab

      # ✅ Optional: debug output if Sentry fails
      - name: Sentry Info
        run: npx sentry-cli info
